# Pipeline experiment config
# All paths relative to this file's directory.

bskysim = "../bskysim/zig-out/bin/bskysim"
construct_cascade = "../construct-cascades/zig-out/bin/construct-cascade"
dataset_creation = "../dataset-creation/dataset-creation"

data = "../bskysim/data/10K_monotonous.bin"

runs = 100
workers = 4

traces_dir = "traces"       # → <project_root>/traces/<name>/
cascades_dir = "cascades"   # → <project_root>/cascades/<name>.ssv
datasets_dir = "datasets"   # → <project_root>/datasets/<name>/

buckets = 256
temp_dir = "/tmp/cascade-building"

[[configs]]
name = "final"
path = "../bskysim/simconfs/final.json"

